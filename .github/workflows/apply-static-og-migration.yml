name: Apply static social-preview migration

on:
  push:
    branches: [agent/optimized-og-jpegs]
    paths:
      - .github/workflows/apply-static-og-migration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimized-og-jpegs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify the migration
        run: |
          npm run fix:og
          npm test
          git diff --check
      - name: Commit the generated static metadata
        run: |
          rm .github/workflows/apply-static-og-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html open-source/index.html historian/index.html package.json scripts/apply-social-preview-contract.mjs test/social-preview.test.mjs .github/workflows/apply-static-og-migration.yml
          git commit -m "fix(og): harden static social previews"
          git push origin HEAD:agent/optimized-og-jpegs
